    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Assay is a read-only integrity layer for tokenized stocks on Base: onchain price vs reference value, multiplier-aware. Not financial advice." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Assay: integrity layer for tokenized stocks on Base</title>
  </head>
